name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**' # Спрацьовує тільки при змінах у папці frontend

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Генерується автоматично
          action: "upload"
          ###### Налаштування шляхів ######
          app_location: "/frontend" # Де лежить код
          api_location: "" # API у нас окремо, тому тут пусто
          output_location: "dist" # Куди Vue складає білд